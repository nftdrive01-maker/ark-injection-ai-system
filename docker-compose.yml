name: ark-injection-ai-system

services:
  amica:
    container_name: ark-amica
    image: node:20-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        LOCKFILE_HASH_FILE=node_modules/.package-lock.sha256
        if [ -f package-lock.json ]; then
          CURRENT_HASH="$$(sha256sum package-lock.json | awk '{print $$1}')"
          STORED_HASH="$$(cat "$$LOCKFILE_HASH_FILE" 2>/dev/null || true)"
        else
          CURRENT_HASH=""
          STORED_HASH="__no_lockfile__"
        fi
        if [ ! -d node_modules ] || [ -z "$$(ls -A node_modules 2>/dev/null)" ] || [ ! -x node_modules/.bin/next ] || [ "$$CURRENT_HASH" != "$$STORED_HASH" ]; then
          if [ -f package-lock.json ]; then
            npm ci
            printf "%s" "$$CURRENT_HASH" > "$$LOCKFILE_HASH_FILE"
          else
            npm install
          fi
        fi
        npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      - injection-tool
    ports:
      - "${AMICA_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INJECTION_TOOL_INTERNAL_URL: http://injection-tool:4001
      NEXT_PUBLIC_CHATBOT_BACKEND: ${AMICA_CHATBOT_BACKEND:-ollama}
      NEXT_PUBLIC_MANAGED_CONFIG_KEYS: ${AMICA_MANAGED_CONFIG_KEYS:-chatbot_backend,ollama_url,ollama_model,vision_backend,vision_ollama_url,vision_ollama_model,tts_backend,piper_url}
      NEXT_PUBLIC_HIDDEN_SETTINGS_PAGES: ${AMICA_HIDDEN_SETTINGS_PAGES:-}
      NEXT_PUBLIC_SHOW_CHAT_MODE: ${AMICA_DEFAULT_SHOW_CHAT_MODE:-true}
      NEXT_PUBLIC_SHOW_SETTINGS_UI: ${AMICA_SHOW_SETTINGS_UI:-true}
      NEXT_PUBLIC_ASYNC_TTS_MODE: ${AMICA_ASYNC_TTS_MODE:-false}
      NEXT_PUBLIC_TTS_BACKEND: ${AMICA_TTS_BACKEND:-stylebertvits2}
      NEXT_PUBLIC_STYLEBERTVITS2_SERVER_URL: http://sbv2:5000
      NEXT_PUBLIC_PIPER_URL: ${AMICA_PIPER_URL:-http://piper:8000}
      NEXT_PUBLIC_OLLAMA_URL: ${AMICA_OLLAMA_URL:-http://host.docker.internal:11434}
      NEXT_PUBLIC_OLLAMA_MODEL: ${AMICA_OLLAMA_MODEL:-qwen2.5:7b}
      NEXT_PUBLIC_VISION_BACKEND: ${AMICA_VISION_BACKEND:-vision_ollama}
      NEXT_PUBLIC_VISION_OLLAMA_URL: ${AMICA_VISION_OLLAMA_URL:-http://host.docker.internal:11434}
      NEXT_PUBLIC_VISION_OLLAMA_MODEL: ${AMICA_VISION_OLLAMA_MODEL:-llava}
      NEXT_PUBLIC_OPENAI_URL: ${AMICA_OPENAI_URL:-https://api.openai.com}
      NEXT_PUBLIC_OPENAI_MODEL: ${AMICA_OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_APIKEY: ${AMICA_OPENAI_APIKEY:-}
      STYLEBERTVITS2_URL: http://sbv2:5000
      PIPER_URL: ${AMICA_PIPER_URL:-http://piper:8000}
      PIPER_DEFAULT_LANGUAGE: ${PIPER_DEFAULT_LANGUAGE:-ja-en-zh-es-fr-pt}
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.0}
      PIPER_NOISE_SCALE: ${PIPER_NOISE_SCALE:-0.667}
      PIPER_NOISE_W: ${PIPER_NOISE_W:-0.8}
      OLLAMA_URL: ${AMICA_OLLAMA_URL:-http://host.docker.internal:11434}
      VISION_OLLAMA_URL: ${AMICA_VISION_OLLAMA_URL:-http://host.docker.internal:11434}
    networks:
      - ark-network
    volumes:
      - ../amica:/app
      - amica_node_modules:/app/node_modules

  injection-tool:
    container_name: ark-injection-tool
    image: node:20-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        LOCKFILE_HASH_FILE=node_modules/.package-lock.sha256
        if [ -f package-lock.json ]; then
          CURRENT_HASH="$$(sha256sum package-lock.json | awk '{print $$1}')"
          STORED_HASH="$$(cat "$$LOCKFILE_HASH_FILE" 2>/dev/null || true)"
        else
          CURRENT_HASH=""
          STORED_HASH="__no_lockfile__"
        fi
        if [ ! -d node_modules ] || [ -z "$$(ls -A node_modules 2>/dev/null)" ] || [ ! -x node_modules/.bin/next ] || [ "$$CURRENT_HASH" != "$$STORED_HASH" ]; then
          if [ -f package-lock.json ]; then
            npm ci
            printf "%s" "$$CURRENT_HASH" > "$$LOCKFILE_HASH_FILE"
          else
            npm install
          fi
        fi
        npm run dev -- --hostname 0.0.0.0 --port 4001
    depends_on:
      - mcp-server
    ports:
      - "127.0.0.1:${INJECTION_TOOL_PORT:-4001}:4001"
    environment:
      PORT: 4001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_AMICA_ORIGIN: ${CLOUDFLARE_EXTERNAL_URL:-http://localhost:${AMICA_PORT:-3000}}
      INJECTION_ADMIN_USERNAME: ${INJECTION_ADMIN_USERNAME:-}
      INJECTION_ADMIN_PASSWORD: ${INJECTION_ADMIN_PASSWORD:-}
      INJECTION_SESSION_SECRET: ${INJECTION_SESSION_SECRET:-}
      INJECTION_AMICA_URL: http://amica:3000
      INJECTION_STYLEBERTVITS2_URL: http://sbv2:5000
      INJECTION_OLLAMA_URL: ${INJECTION_OLLAMA_URL:-http://host.docker.internal:11434}
      INJECTION_OPENAI_BASE_URL: ${AMICA_OPENAI_URL:-https://api.openai.com}
      INJECTION_OPENAI_API_KEY: ${AMICA_OPENAI_APIKEY:-}
      INJECTION_MCP_ROUTER_TIMEOUT: ${INJECTION_MCP_ROUTER_TIMEOUT:-30000}
      INJECTION_MCP_INTERNAL_BASE_URL: http://mcp-server:8000
    networks:
      - ark-network
    volumes:
      - ../injection-tool:/app
      - injection_tool_node_modules:/app/node_modules

  mcp-server:
    container_name: ark-mcp-server
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    environment:
      FETCH_DEBUG_SAVE_JSON: "1"
      FETCH_DEBUG_LOG_SEARCH_WEB: "1"
      FETCH_DEBUG_DIR: /app/debug-json
    volumes:
      - ../mcp-server/debug-json:/app/debug-json
    networks:
      - ark-network

  sbv2-init:
    container_name: ark-sbv2-init
    build:
      context: ../sbv2/Style-Bert-VITS2
      dockerfile: Dockerfile.infer
    entrypoint:
      - python
      - initialize.py
      - --only_infer
    volumes:
      - ../sbv2/Style-Bert-VITS2/model_assets:/app/model_assets
      - ../sbv2/Style-Bert-VITS2/bert:/app/bert
    networks:
      - ark-network

  sbv2:
    container_name: ark-sbv2
    build:
      context: ../sbv2/Style-Bert-VITS2
      dockerfile: Dockerfile.infer
    depends_on:
      sbv2-init:
        condition: service_completed_successfully
    ports:
      - "${SBV2_PORT:-5000}:5000"
    environment:
      SBV2_DEVICE: ${SBV2_DEVICE:-cpu}
    volumes:
      - ../sbv2/Style-Bert-VITS2/model_assets:/app/model_assets
      - ../sbv2/Style-Bert-VITS2/bert:/app/bert
      - ../sbv2/Style-Bert-VITS2/Data:/app/Data
    networks:
      - ark-network
    restart: unless-stopped

  piper:
    container_name: ark-piper
    image: ghcr.io/ayutaz/piper-plus/python-inference:dev
    ports:
      - "${PIPER_PORT:-5001}:8000"
    environment:
      PIPER_MODEL_URL: "${PIPER_MODEL_URL:-}"
      PIPER_CONFIG_URL: "${PIPER_CONFIG_URL:-}"
      PIPER_DEFAULT_LANGUAGE: "${PIPER_DEFAULT_LANGUAGE:-ja}"
      PIPER_LENGTH_SCALE: "${PIPER_LENGTH_SCALE:-1.0}"
      PIPER_NOISE_SCALE: "${PIPER_NOISE_SCALE:-0.667}"
      PIPER_NOISE_W: "${PIPER_NOISE_W:-0.8}"
      PIPER_DEVICE: "${PIPER_DEVICE:-cpu}"
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        import json
        import os
        import urllib.request
        from pathlib import Path

        model_url = os.environ['PIPER_MODEL_URL'].strip()
        config_url = os.environ['PIPER_CONFIG_URL'].strip()
        if not model_url or not config_url:
          raise SystemExit(
            'PIPER_MODEL_URL and PIPER_CONFIG_URL must be set. '
            'This repository does not bundle a default Piper voice model.'
          )
        model_dir = Path('/app/models')
        model_path = model_dir / 'model.onnx'
        config_path = model_dir / 'config.json'
        meta_path = model_dir / '.source.json'
        model_dir.mkdir(parents=True, exist_ok=True)

        desired = {
            'model_url': model_url,
            'config_url': config_url,
        }

        current = None
        if meta_path.exists():
            try:
                current = json.loads(meta_path.read_text(encoding='utf-8'))
            except Exception:
                current = None

        should_refresh = current != desired or not model_path.exists() or not config_path.exists()
        if should_refresh:
            for url, destination in ((model_url, model_path), (config_url, config_path)):
                with urllib.request.urlopen(url) as response, destination.open('wb') as output:
                    output.write(response.read())
            meta_path.write_text(json.dumps(desired, ensure_ascii=True, indent=2), encoding='utf-8')
        PY
        exec python /app/server.py
    volumes:
      - ../piper/data:/app/models
      - ../piper/out:/app/output
      - ../piper/server.py:/app/server.py:ro
    networks:
      - ark-network
    restart: unless-stopped

  dbhub:
    container_name: ark-dbhub
    image: bytebase/dbhub:latest
    ports:
      - "${DBHUB_PORT:-8080}:8080"
    environment:
      - DBHUB_LOG_LEVEL=info
      - DB_DSN=postgres://${DB_USER:-user}:${DB_PASSWORD:-password}@ark-database:5432/${DB_NAME:-dbname}
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --config
      - /app/dbhub.toml
    volumes:
      - ./dbhub.toml:/app/dbhub.toml:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ark-network

  database:
    container_name: ark-database
    image: postgres:15-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-dbname}
    volumes:
      - ark-db-data:/var/lib/postgresql/data
    networks:
      - ark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-dbname}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  google-workspace-mcp:
    container_name: ark-google-workspace-mcp
    profiles:
      - google-workspace-mcp
    build:
      context: ../google-workspace-mcp
    ports:
      - "${GOOGLE_WORKSPACE_MCP_PORT:-8001}:8000"
    environment:
      WORKSPACE_MCP_PORT: "8000"
      WORKSPACE_MCP_HOST: "0.0.0.0"
      WORKSPACE_EXTERNAL_URL: "${CLOUDFLARE_EXTERNAL_URL:-http://localhost:${GOOGLE_WORKSPACE_MCP_PORT:-8001}}"
      MCP_SINGLE_USER_MODE: "1"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      WORKSPACE_MCP_CREDENTIALS_DIR: "/app/credentials"
      TOOLS: ""
    networks:
      - ark-network
    volumes:
      - ./google-workspace-mcp-credentials:/app/credentials

  estat-mcp:
    container_name: ark-estat-mcp
    profiles:
      - estat-mcp
    build:
      context: ../estat-mcp
    ports:
      - "${ESTAT_MCP_PORT:-8002}:8000"
    environment:
      ESTAT_APP_ID: ${ESTAT_APP_ID:-}
      ESTAT_MCP_HOST: 0.0.0.0
      ESTAT_MCP_PORT: 8000
    command:
      - serve
      - --transport
      - sse
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    networks:
      - ark-network

networks:
  ark-network:
    driver: bridge

volumes:
  amica_node_modules:
  injection_tool_node_modules:
  ark-db-data:
